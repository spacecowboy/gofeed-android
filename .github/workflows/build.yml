name: Reproducible build check

on:
  pull_request:
  push:
    branches: [main]

env:
  GO_VERSION: '1.27.1'          # pin exact
  NDK_VERSION: '27.2.12479018'  # pin exact, match F-Droid's

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: jdk17-a, jdk: '17', dir: build-a }
          - { id: jdk17-b, jdk: '17', dir: some/deeper/build-b }
          - { id: jdk25-a, jdk: '25', dir: build-a }
          - { id: jdk25-b, jdk: '25', dir: some/deeper/build-b }
    steps:
      - uses: actions/checkout@v7
        with:
          path: ${{ matrix.dir }}

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.dir }}/gofeed/go.sum

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.jdk }}
          distribution: temurin

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          gomobile init

      - uses: gradle/actions/setup-gradle@v6

      - name: Build release AAR
        working-directory: ${{ matrix.dir }}
        run: ./gradlew bundleReleaseAar --no-build-cache

      - name: Collect first AAR
        run: |
          mkdir -p "$RUNNER_TEMP/out/first"
          aar=$(find "${{ matrix.dir }}" -path '*outputs/aar/lib-release.aar' | head -1)
          cp "$aar" "$RUNNER_TEMP/out/first/lib-release.aar"

      - name: Rebuild in same dir
        working-directory: ${{ matrix.dir }}
        run: ./gradlew clean bundleReleaseAar --no-build-cache

      - name: Collect rebuilt AAR
        run: |
          mkdir -p "$RUNNER_TEMP/out/rebuild"
          aar=$(find "${{ matrix.dir }}" -path '*outputs/aar/lib-release.aar' | head -1)
          cp "$aar" "$RUNNER_TEMP/out/rebuild/lib-release.aar"

      - uses: actions/upload-artifact@v5
        with:
          name: aar-${{ matrix.id }}
          path: ${{ runner.temp }}/out/first/lib-release.aar

      - uses: actions/upload-artifact@v5
        with:
          name: aar-${{ matrix.id }}-rebuild
          path: ${{ runner.temp }}/out/rebuild/lib-release.aar

  compare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: aar-*
          path: aars            # -> aars/aar-<id>/lib-release.aar

      - name: Install diffoscope
        run: |
          sudo apt-get update
          sudo apt-get install -y diffoscope-minimal binutils binutils-multiarch

      - name: Extract AARs
        run: |
          for d in aars/aar-*; do
            name=${d#aars/aar-}
            mkdir -p "extracted/$name"
            unzip -q "$d/lib-release.aar" -d "extracted/$name"
          done
          ls extracted

      - name: Compare .so files and run diffoscope on differences
        run: |
          ref=jdk17-a
          mkdir -p reports
          failed=0
          {
            echo "## Reproducibility report"
            echo "Reference variant: \`$ref\`"
            echo
            echo "| Variant | File | Result |"
            echo "|---|---|---|"
          } > summary.md

          for dir in extracted/*; do
            name=$(basename "$dir")
            [ "$name" = "$ref" ] && continue

            # classes.jar is informational only (expected to differ across JDKs)
            if cmp -s "extracted/$ref/classes.jar" "$dir/classes.jar"; then
              echo "| $name | classes.jar | identical |" >> summary.md
            else
              echo "| $name | classes.jar | differs |" >> summary.md
            fi

            while IFS= read -r so; do
              if cmp -s "extracted/$ref/$so" "$dir/$so"; then
                echo "| $name | $so | identical |" >> summary.md
                continue
              fi
              failed=1
              echo "| $name | $so | **DIFFERS** |" >> summary.md

              slug=$(echo "$name-$so" | tr '/' '_')
              diffoscope \
                --text "reports/$slug.txt" \
                --html "reports/$slug.html" \
                "extracted/$ref/$so" "$dir/$so" || true

              {
                echo
                echo "<details><summary>diffoscope: $ref vs $name, $so</summary>"
                echo
                echo '```'
                head -c 30000 "reports/$slug.txt"
                echo '```'
                echo "</details>"
                echo
              } >> details.md
            done < <(cd "extracted/$ref" && find jni -name '*.so' | sort)
          done

          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          [ -f details.md ] && cat details.md >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$failed" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: diffoscope-reports
          path: reports/
          if-no-files-found: ignore

      - name: Fail if any .so differs
        if: env.failed == '1'
        run: |
          echo "::error::libgojni.so differs between variants, see diffoscope-reports and the job summary"
          exit 1
